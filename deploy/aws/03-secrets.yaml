# JHI-SIG: 69M2705M | Identity, Auth & Security | JHI Research & Analytics Firm, Inc. (proprietary)
# ---------------------------------------------------------------------------
# Aegira — AWS Secrets Manager scaffolding (KEYS ONLY, no values committed).
#
# Security mitigation (closes: "plaintext secrets in env/repo/CI logs"):
#   * Runtime secrets live in Secrets Manager, encrypted at rest with the AWS
#     managed KMS key. App Runner injects them at start via RuntimeEnvironment-
#     Secrets (see 06-apprunner-services.yaml) so they never appear in the image,
#     the task definition, or GitHub.
#   * This template creates EMPTY secrets (no SecretString) — the Founder pastes
#     the real values in the console/CLI AFTER the stack is created. Nothing
#     secret is ever in source control.
#
# Deploy once PER ENVIRONMENT (EnvironmentName=staging, then production).
# ---------------------------------------------------------------------------
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Aegira runtime secret scaffolding in AWS Secrets Manager. Creates empty
  secrets (keys only) that the Founder populates out-of-band. Per environment.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
    Description: Environment these secrets belong to (staging or production).

Resources:
  # DATABASE_URL -> the RDS endpoint, e.g.
  #   postgresql+psycopg://aegira:<pw>@<rds-endpoint>:5432/aegira
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/DATABASE_URL
      Description: >-
        SQLAlchemy Postgres URL pointing at the private RDS endpoint
        (postgresql+psycopg://USER:PASSWORD@HOST:5432/DBNAME).

  # AUTH_JWT_SECRET -> >= 32 bytes; Settings.validate() enforces this in prod.
  AuthJwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/AUTH_JWT_SECRET
      Description: >-
        HS256 signing secret for auth/session JWTs. Generate with
        'openssl rand -hex 32' (>= 32 bytes required in production).

  # APP_ENCRYPTION_KEY -> Fernet key for at-rest 2FA-secret encryption.
  AppEncryptionKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/APP_ENCRYPTION_KEY
      Description: >-
        urlsafe-base64 32-byte Fernet key for at-rest field encryption. If unset
        the app derives one from AUTH_JWT_SECRET; set a dedicated key in prod.

  # Comma-separated staff emails granting back-office (God-Eye) access.
  JhiStaffEmails:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/JHI_STAFF_EMAILS
      Description: Comma-separated staff emails granted back-office access.

  # --- Market / macro data provider keys (optional but recommended) ---------
  FredApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/FRED_API_KEY
      Description: FRED (St. Louis Fed) API key for the macro dashboard.

  NasdaqDataLinkApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/NASDAQ_DATA_LINK_API_KEY
      Description: Nasdaq Data Link (Sharadar SF1) fundamentals API key.

  DataGovApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/DATA_GOV_API_KEY
      Description: api.data.gov shared key (activates EIA energy feeds).

  TwelveDataApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/TWELVEDATA_API_KEY
      Description: Twelve Data market data API key (optional).

  StripeWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/STRIPE_WEBHOOK_SECRET
      Description: Stripe webhook signing secret for billing event verification.

  # --- Editorial LLM (Amazon Bedrock) — optional -----------------------------
  AwsBearerTokenBedrock:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: aegira/${EnvironmentName}/AWS_BEARER_TOKEN_BEDROCK
      Description: >-
        Amazon Bedrock bearer token; when set the editorial engine uses Bedrock
        (region us-east-1). Prefer an IAM role over a bearer token in prod.

Outputs:
  DatabaseUrlSecretArn:
    Description: ARN for the DATABASE_URL secret (referenced by App Runner).
    Value:
      Ref: DatabaseUrlSecret
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-database-url-arn
  AuthJwtSecretArn:
    Description: ARN for the AUTH_JWT_SECRET secret (referenced by App Runner).
    Value:
      Ref: AuthJwtSecret
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-auth-jwt-arn
  AppEncryptionKeyArn:
    Description: ARN for the APP_ENCRYPTION_KEY secret.
    Value:
      Ref: AppEncryptionKey
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-app-encryption-key-arn
  JhiStaffEmailsArn:
    Description: ARN for the JHI_STAFF_EMAILS secret.
    Value:
      Ref: JhiStaffEmails
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-jhi-staff-emails-arn
  FredApiKeyArn:
    Description: ARN for the FRED_API_KEY secret.
    Value:
      Ref: FredApiKey
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-fred-api-key-arn
  NasdaqDataLinkApiKeyArn:
    Description: ARN for the NASDAQ_DATA_LINK_API_KEY secret.
    Value:
      Ref: NasdaqDataLinkApiKey
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-nasdaq-api-key-arn
  DataGovApiKeyArn:
    Description: ARN for the DATA_GOV_API_KEY secret.
    Value:
      Ref: DataGovApiKey
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secret-data-gov-api-key-arn
  SecretsArnPrefix:
    Description: >-
      Wildcard ARN prefix covering all Aegira secrets for this environment; use
      it to scope the App Runner instance role's secretsmanager:GetSecretValue.
    Value:
      Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:aegira/${EnvironmentName}/*
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-secrets-arn-prefix
