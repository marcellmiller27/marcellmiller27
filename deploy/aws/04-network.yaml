# JHI-SIG: 69M2705M | Build & Deploy | JHI Research & Analytics Firm, Inc. (proprietary)
# ---------------------------------------------------------------------------
# Aegira — VPC + subnets + security groups for RDS and the App Runner connector.
#
# Security mitigations:
#   * "Public database" -> RDS lives in PRIVATE subnets with no route to the
#     internet gateway; its security group only accepts 5432 from the App Runner
#     connector SG (no CIDR, no 0.0.0.0/0).
#   * "Backend cannot reach the internet privately" -> a NAT gateway in a public
#     subnet gives the private subnets outbound-only internet (FRED, Nasdaq,
#     Bedrock, SES) with no inbound exposure.
#
# Deploy once PER ENVIRONMENT (or share one VPC across envs — parameterize CIDRs
# to avoid overlap if you peer them later).
# ---------------------------------------------------------------------------
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Aegira network layer: a VPC with two public and two private subnets, an
  internet gateway, a NAT gateway, and the security groups that lock RDS to the
  App Runner VPC connector.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: CIDR for the VPC (use a distinct block per environment).
  PublicSubnet1Cidr:
    Type: String
    Default: 10.40.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.40.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.40.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.40.11.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock:
        Ref: VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PublicSubnet1Cidr
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PublicSubnet2Cidr
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PrivateSubnet1Cidr
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PrivateSubnet2Cidr
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet1

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet2

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt:
          - NatEip
          - AllocationId
      SubnetId:
        Ref: PublicSubnet1
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet1

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet2

  # SG attached to the App Runner VPC connector (source of DB traffic).
  AppRunnerConnectorSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Aegira App Runner VPC connector egress. Outbound-only; used as the
        source principal for RDS ingress.
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (to RDS, NAT/internet, Bedrock, SES).
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-apprunner-connector-sg

  # SG for RDS: ONLY accepts Postgres from the connector SG (no public access).
  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Aegira RDS Postgres. Ingress 5432 restricted to the App Runner connector
        SG only. No public / CIDR ingress.
      VpcId:
        Ref: Vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: aegira-${EnvironmentName}-rds-sg

  RdsIngressFromConnector:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: RdsSg
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId:
        Ref: AppRunnerConnectorSg
      Description: Postgres from the App Runner VPC connector only.

Outputs:
  VpcId:
    Value:
      Ref: Vpc
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-vpc-id
  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs (for RDS + App Runner connector).
    Value:
      Fn::Join:
        - ","
        - - Ref: PrivateSubnet1
          - Ref: PrivateSubnet2
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-private-subnet-ids
  AppRunnerConnectorSgId:
    Value:
      Ref: AppRunnerConnectorSg
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-apprunner-connector-sg-id
  RdsSgId:
    Value:
      Ref: RdsSg
    Export:
      Name:
        Fn::Sub: aegira-${EnvironmentName}-rds-sg-id
