# John Henry Investments — full platform (Postgres + backend + frontend).
# Usage:  docker compose up --build
#   Frontend: http://localhost:3000   Backend API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jhi
      POSTGRES_PASSWORD: jhi
      POSTGRES_DB: jhi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Durable Postgres persistence (parity with production).
      DATABASE_URL: postgresql+psycopg://jhi:jhi@db:5432/jhi
      WEB_CONCURRENCY: "2"
      # Forward API keys / secrets from the host (or Cursor Secrets, which inject
      # into the VM env) into the container. ${VAR:-} = empty when unset, so no
      # secret value is ever hardcoded here and the file is safe to commit.
      FRED_API_KEY: ${FRED_API_KEY:-}
      BLS_API_KEY: ${BLS_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      NASDAQ_DATA_LINK_API_KEY: ${NASDAQ_DATA_LINK_API_KEY:-}
      FUNDAMENTALS_API_KEY: ${FUNDAMENTALS_API_KEY:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # For production, set these (config validation enforces them):
      # APP_ENV: production
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      # Comma-separated emails of JHI staff (Founder + employees) — grants back-office
      # access (Accounting, Admin, etc.) until a dedicated staff role/column lands.
      JHI_STAFF_EMAILS: ${JHI_STAFF_EMAILS:-}
      # Editorial E2 (grounded LLM). OFF by default — set ENABLE_LLM_EDITORIAL=1 to
      # elevate newsletter prose (fact-locked). Provider is auto-selected: Amazon
      # Bedrock if AWS_BEARER_TOKEN_BEDROCK is set, else Anthropic-direct (sk-ant-).
      # For Bedrock, EDITORIAL_LLM_MODEL must be the Bedrock model / inference-profile id.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      ENABLE_LLM_EDITORIAL: ${ENABLE_LLM_EDITORIAL:-0}
      EDITORIAL_LLM_MODEL: ${EDITORIAL_LLM_MODEL:-claude-sonnet-4-5}
      EDITORIAL_LLM_MONTHLY_BUDGET_USD: ${EDITORIAL_LLM_MONTHLY_BUDGET_USD:-250}
      # Origin the backend prints from for exact-as-viewed newsletter PDFs (headless
      # Chromium renders the real page). The frontend service on the compose network.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://frontend:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin: the browser hits the frontend's own /api/v1, which Next
        # proxies to the backend server-side (see next.config.mjs rewrites).
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        # Server-side proxy target. Baked at build (Next bakes rewrites at build
        # time). Reaches the backend on the compose network; no browser
        # dependency on :8000, no CORS.
        API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
